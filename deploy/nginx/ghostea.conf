# Put this server block behind your TLS certificate.
# Do not expose port 10000 directly to the public internet when nginx is used.
server {
    listen 443 ssl http2;
    server_name api.example.com;

    # Configure cert/key with your ACME provider.
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    location = /health {
        proxy_pass http://127.0.0.1:10000/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Self-hosted mode serves the dashboard from the Ghostea process.
    # Managed/Vercel mode should not point its public dashboard here.
    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
